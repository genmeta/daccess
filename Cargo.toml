[package]
name = "daccess"
description = "Name-based access control for DHttp"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/genmeta/daccess"
readme = "README.md"

[lib]
name = "access_control"
path = "src/daccess.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "query"] }
chrono = { version = "0.4", features = ["serde"] }
http = "1"
radix_trie = "0.2"
sea-orm = { version = "2", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
snafu = "0.9"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
